# CI/CD: тесты (unit + Testcontainers, покрытие JaCoCo) → образ → развёртывание в Kubernetes (kind) → smoke-тест
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# новый push в ту же ветку отменяет устаревший запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]          # обе LTS: основная (21) и следующая (25)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven               # кеш ~/.m2 по хешу pom.xml

      # unit (surefire) + интеграционные на PostgreSQL в Docker (failsafe + Testcontainers) + порог покрытия JaCoCo
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'P' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          p = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(p):
              print("coverage report not found"); raise SystemExit
          rows = list(csv.DictReader(open(p)))
          s = lambda k: sum(int(r[k]) for r in rows)
          lc, lm, bc, bm = s("LINE_COVERED"), s("LINE_MISSED"), s("BRANCH_COVERED"), s("BRANCH_MISSED")
          print(f"### Coverage (Java ${{ matrix.java }})\n\n| | covered | % |\n|---|---|---|")
          print(f"| lines | {lc}/{lc+lm} | **{100*lc/(lc+lm):.1f}%** |")
          print(f"| branches | {bc}/{bc+bm} | {100*bc/(bc+bm):.1f}% |")
          P

      - name: Upload coverage report
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # CI: образ собирается тем же multi-stage Dockerfile; слои (в т.ч. зависимости Maven) кешируются в GitHub Actions cache
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: library-api:1.2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CD: одноузловой кластер Kubernetes прямо в раннере
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load image into cluster
        run: kind load docker-image library-api:1.2.0 --name ci

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl -n library create secret generic library-db --from-literal=password="$(openssl rand -hex 16)"
          kubectl apply -f k8s/01-config.yaml -f k8s/02-postgres.yaml -f k8s/03-api.yaml -f k8s/04-kafka.yaml
          kubectl -n library rollout status statefulset/library-db --timeout=5m
          kubectl -n library rollout status statefulset/library-kafka --timeout=5m
          kubectl -n library rollout status deployment/library-api --timeout=8m
          kubectl -n library get pods -o wide

      - name: Smoke test through the Service
        run: |
          kubectl -n library port-forward svc/library-api 8080:80 >/dev/null 2>&1 &
          sleep 5
          curl -sf localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -sf localhost:8080/api/v1/books | grep -q '"totalItems":4'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/books/999999)" = 404
          # выдача книги → событие через outbox и Kafka → статистика, построенная consumer'ом
          curl -sf -X POST localhost:8080/api/v1/loans -H 'Content-Type: application/json' -d '{"bookId":1,"readerId":1}' | grep -q '"status":"ACTIVE"'
          for i in $(seq 1 30); do
            curl -sf localhost:8080/api/v1/stats/books/top | grep -q '"timesIssued":1' && break
            sleep 2
          done
          curl -sf localhost:8080/api/v1/stats/books/top | grep -q '"timesIssued":1'
          echo "smoke test passed"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n library describe pods
          kubectl -n library logs deploy/library-api --tail=100 || true
          kubectl -n library logs statefulset/library-kafka --tail=50 || true
