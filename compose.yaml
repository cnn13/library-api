name: library

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library}
      POSTGRES_USER: ${DB_USER:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks: [backend]
    # порт СУБД наружу не публикуется: к базе ходит только сервис

  api:
    build:
      context: .
      target: runtime
    image: library-api:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-library}
      DB_USER: ${DB_USER:-library}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "${API_PORT:-8080}:8080"
    mem_limit: 384m
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
